<!DOCTYPE html>
<html>
<head>
    <title>Backend Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Backend API Test</h1>
    
    <div>
        <button onclick="testLogin()">1. Test Login (admin/admin123)</button>
        <button onclick="testDashboard()">2. Test Dashboard</button>
        <button onclick="testCandidates()">3. Test Candidates</button>
        <button onclick="testPanelists()">4. Test Panelists</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        let token = localStorage.getItem('token');
        let userId = null;
        
        function log(message, isError = false) {
            const div = document.createElement('div');
            div.className = 'test ' + (isError ? 'error' : 'success');
            div.innerHTML = '<strong>' + new Date().toLocaleTimeString() + '</strong><br>' + message;
            document.getElementById('results').appendChild(div);
        }
        
        async function testLogin() {
            try {
                log('Testing login with admin/admin123...');
                const response = await fetch('http://localhost:8081/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'admin', password: 'admin123' })
                });
                
                const data = await response.json();
                log('Response: <pre>' + JSON.stringify(data, null, 2) + '</pre>');
                
                if (data.token) {
                    token = data.token;
                    userId = data.id;
                    localStorage.setItem('token', token);
                    log('✅ Login successful! Token saved. User ID: ' + userId);
                } else {
                    log('❌ Login failed: ' + (data.message || 'Unknown error'), true);
                }
            } catch (err) {
                log('❌ Error: ' + err.message, true);
            }
        }
        
        async function testDashboard() {
            if (!token || !userId) {
                log('❌ Please login first!', true);
                return;
            }
            
            try {
                log('Testing dashboard API...');
                const response = await fetch(`http://localhost:8081/api/hr/${userId}/dashboard`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                log('Response: <pre>' + JSON.stringify(data, null, 2) + '</pre>');
                
                if (data.success) {
                    log('✅ Dashboard loaded successfully!');
                } else {
                    log('❌ Dashboard failed: ' + (data.message || 'Unknown error'), true);
                }
            } catch (err) {
                log('❌ Error: ' + err.message, true);
            }
        }
        
        async function testCandidates() {
            if (!token || !userId) {
                log('❌ Please login first!', true);
                return;
            }
            
            try {
                log('Testing candidates API...');
                const response = await fetch(`http://localhost:8081/api/hr/${userId}/my-candidates`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                log('Response: <pre>' + JSON.stringify(data, null, 2) + '</pre>');
                
                if (data.success) {
                    log('✅ Candidates loaded: ' + (data.candidates?.length || 0) + ' found');
                } else {
                    log('❌ Candidates failed: ' + (data.message || 'Unknown error'), true);
                }
            } catch (err) {
                log('❌ Error: ' + err.message, true);
            }
        }
        
        async function testPanelists() {
            if (!token || !userId) {
                log('❌ Please login first!', true);
                return;
            }
            
            try {
                log('Testing panelists API...');
                const response = await fetch(`http://localhost:8081/api/panelists/hr/${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                log('Response: <pre>' + JSON.stringify(data, null, 2) + '</pre>');
                
                if (data.success) {
                    log('✅ Panelists loaded: ' + (data.panelists?.length || 0) + ' found');
                } else {
                    log('❌ Panelists failed: ' + (data.message || 'Unknown error'), true);
                }
            } catch (err) {
                log('❌ Error: ' + err.message, true);
            }
        }
        
        // Auto-load token if exists
        if (token) {
            log('Token found in localStorage');
        }
    </script>
</body>
</html>
