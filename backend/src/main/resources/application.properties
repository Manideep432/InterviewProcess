# Server Configuration
server.port=8081
spring.application.name=login-service

# Database Configuration - MySQL (Production)
spring.datasource.url=jdbc:mysql://localhost:3306/logindb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# H2 Database Configuration (Development/Testing - Commented out, using MySQL)
#spring.datasource.url=jdbc:h2:file:./data/logindb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
